<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#833ab4"><title>投稿管理｜指吸建設</title><link rel="stylesheet" href="/style.css?v=20260930-1505"><link rel="stylesheet" href="/social.css"></head><body><main class="social-main"><nav class="app-nav" aria-label="管理画面"><a href="/">仕事DM</a><a href="/eye.html">eye・要対応</a><a href="/social.html" aria-current="page">投稿予定</a></nav><header><div><span class="eyebrow">YUBISUI KENSETSU</span><h1>投稿を、見守る。</h1></div></header><p id="social-login" hidden>所有者ログインが必要です。<a href="/">仕事DMアプリの通知・接続設定</a>からログインしてください。</p><div id="social-owner" hidden><section class="summary"><div><span class="eyebrow">クラウド予約投稿</span><h2 id="social-mode">確認中</h2></div><button id="social-toggle" class="primary" disabled>確認中</button></section><p class="hint">準備・検品済みの素材を自動公開します。毎週の制作で準備した画像と文章を確認できます。ストーリーは掲載順に表示します。画像を押すと拡大できます。「下書き・公開保留」は自動公開されません。公開処理が始まった投稿は停止できません。</p><div class="section-head"><h2>予定と公開結果</h2></div><div id="social-jobs"></div><details class="support-details"><summary>反応の記録</summary><p class="hint">取得時点の累計値です。公開時期や内容が異なるため、単純な順位付けはしません。</p><div id="social-insights"></div></details><details class="support-details"><summary>稼働状況・最近の動作</summary><p id="social-heartbeat"></p><div id="social-events"></div></details></div><p id="social-error" role="status"></p><footer>株式会社 指吸建設</footer></main><script type="module" src="/social.js?v=20260930-1505"></script></body></html>
