<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#833ab4"><title>投稿をつくる｜指吸建設</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio.css"></head><body><main><header><span class="eyebrow">YUBISUI STUDIO</span><h1>次の一枚を、ここで。</h1><a href="/social">投稿管理へ戻る</a></header><p id="login" hidden>先に<a href="/">所有者ログイン</a>をしてください。</p><div id="owner" hidden><p class="hint">スマホで制作・編集・予約できます。ここで作ったものは、予約するまで公開されません。</p><label>保存した下書き<select id="draft"><option value="">新しく作る</option></select></label><div class="grid"><section><label>種類<select id="kind"><option value="feed">通常投稿（16時公開）</option><option value="story">ストーリー（11時公開）</option></select></label><label>目的<select id="category"><option>求人</option><option>協力業者</option><option>面白</option></select></label><label>どんな画像にする？<textarea id="brief" maxlength="700" rows="3" placeholder="例：黄色いメジャーがくるっと丸まり、小さな橋のように見える写真"></textarea></label><p class="hint">制作指示だけをCloudflareの画像生成へ送ります。個人情報や非公開の仕事情報は入れないでください。</p><button id="generate" class="primary">新しい画像を作る</button><p class="hint">無料枠で1日6回まで。日本時間9時に回復。写真や文字の仕上がりを確認してください。</p><label>見出し（改行できます）<textarea id="headline" maxlength="60" rows="3">まずは、話から。</textarea></label><label>見せ方<select id="layout"><option value="editorial">余白と写真</option><option value="photo">写真を大きく</option><option value="split">左右に分ける</option></select></label><label>差し色<input id="accent" type="color" value="#a84633"></label></section><section><h2>公開する画像</h2><canvas id="preview" width="1080" height="1350" aria-label="投稿画像のプレビュー"></canvas><p class="hint">画像の文字も、この見た目で公開します。</p><label>投稿文<textarea id="caption" maxlength="2100" rows="9"></textarea></label><p class="hint" id="story-note" hidden>ストーリーにはこの投稿文は表示されません。案内は画像内に入ります。</p><label>公開日<input id="date" type="date" required></label><p id="deadline" class="hint"></p><div class="actions"><button id="save" class="secondary">下書きを保存</button><button id="queue" class="primary">この内容で予約する</button></div></section></div></div><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="/studio.js"></script></body></html>
